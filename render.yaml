# Render Blueprint: a demo copy of the site to show around (Render → New → Blueprint → this repository).
# Free plan: the site sleeps after 15 minutes without visitors (the first visit then takes about a minute).
# STORAGE=memory: no database. Forms work and inquiries show in /admin, but they are gone after every restart,
# redeploy and wake-up (the built-in PostgreSQL needs about 1 GB to start; the free plan has 512 MB). To keep
# inquiries, remove STORAGE and set DATABASE_URL to a PostgreSQL database. Production runs on Google Cloud.
services:
  - type: web
    name: windmill-invest-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: STORAGE
        value: memory
      - key: ADMIN_PASSWORD
        generateValue: true
