# Render Blueprint: a demo copy of the site to show around (Render → New → Blueprint → this repository).
# Free plan: the site sleeps after 15 minutes without visitors (the first visit then takes about a minute).
# Inquiries go to the built-in PostgreSQL on the service's own disk, which Render wipes on every restart,
# redeploy and wake-up: fine for a demo, not for real leads. Production runs on Google Cloud (see README).
# To keep demo inquiries, add a DATABASE_URL to a PostgreSQL database under Environment.
services:
  - type: web
    name: windmill-invest-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_PASSWORD
        generateValue: true
