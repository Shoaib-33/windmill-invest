# Render Blueprint: a demo copy of the site to show around (Render → New → Blueprint → this repository).
# Free plan: the site sleeps after 15 minutes without visitors (the first visit then takes about a minute).
# Needs DATABASE_URL (Environment tab): an external PostgreSQL, e.g. a free Neon database (neon.tech). The
# built-in PostgreSQL does not fit: it needs about 1 GB of memory to start, the free plan has 512 MB.
# Production runs on Google Cloud (see README).
services:
  - type: web
    name: windmill-invest-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
