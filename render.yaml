# Render Blueprint: a demo copy of the site to show around (Render → New → Blueprint → this repository).
# Free plan: the site sleeps after 15 minutes without visitors (the first visit then takes about a minute),
# and Render's free database expires after 30 days. Production runs on Google Cloud (see README).
services:
  - type: web
    name: windmill-invest-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: windmill-invest-demo-db
          property: connectionString

databases:
  - name: windmill-invest-demo-db
    plan: free
    region: frankfurt
    databaseName: windmill
    user: windmill
